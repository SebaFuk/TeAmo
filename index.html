<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
  <title>Para Luci ❤️</title>

  <style>
    :root {
      --bg1: #ffe3ee;
      --bg2: #f4e8df;
      --bg3: #f3efe9;
      --ink: #1f1f1f;
      --muted: #6b6b6b;
      --accent: #e11d48;
      --card: rgba(255, 255, 255, .60);
      --stroke: rgba(0, 0, 0, .06);
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      height: 100%
    }

    body {
      margin: 0;
      padding: 14px;
      color: var(--ink);
      background: radial-gradient(1200px 700px at 20% 10%, var(--bg1) 0%, var(--bg2) 55%, var(--bg3) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      overflow: auto;
      font-family: ui-serif, Georgia, "Times New Roman", Times, serif;
      min-height: 100vh;
      overscroll-behavior-y: contain;
      -webkit-overflow-scrolling: touch;
    }

    .wrap {
      width: min(1180px, 96vw);
      animation: popIn .9s cubic-bezier(.2, 1.1, .2, 1) both;
      transform-origin: 50% 60%;
      position: relative;
      z-index: 1;
    }

    @keyframes popIn {
      0% {
        opacity: 0;
        transform: translateY(18px) scale(.98)
      }

      100% {
        opacity: 1;
        transform: translateY(0) scale(1)
      }
    }

    .card {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--stroke);
      border-radius: 22px;
      box-shadow: 0 18px 60px rgba(0, 0, 0, .10);
      overflow: hidden;
      display: grid;
      grid-template-columns: 1.02fr .98fr;
      backdrop-filter: blur(8px);
      min-height: 560px;
    }

    @media (max-width: 900px) {
      body {
        align-items: flex-start;
        padding-top: 20px;
      }

      .card {
        grid-template-columns: 1fr;
        gap: 20px;
        align-items: start;
      }

      .left {
        padding: 15px;
      }

      .stage {
        min-height: 0;
        aspect-ratio: 1 / 1;
      }


      .msg {
        max-height: 260px;
        margin-top: 10px;
        padding: 14px 14px;
        background: rgba(255, 255, 255, .72);
        border: 1px solid var(--stroke);
        border-radius: 16px;
        font-size: 17px;
        line-height: 1.48;
        white-space: pre-wrap;
        position: relative;
        overflow: auto;
        padding-right: 10px;
        scrollbar-gutter: stable;
      }

      .msg::-webkit-scrollbar {
        width: 10px;
      }

      .msg::-webkit-scrollbar-thumb {
        background: rgba(0, 0, 0, .15);
        border-radius: 999px;
        border: 3px solid transparent;
        background-clip: content-box;
      }

      .btnRow button {
        flex: 1 1 170px
      }
    }

    .left {
      padding: 20px;
      background: linear-gradient(180deg, rgba(255, 255, 255, .58), rgba(255, 255, 255, .32));
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 520px;
    }

    .right {
      padding: 20px;
      display: flex;
      flex-direction: column;

      justify-content: center;
      position: relative;
    }

    .sparkle {
      position: absolute;
      inset: -80px -80px auto auto;
      width: 220px;
      height: 220px;
      background: radial-gradient(circle at 35% 35%, rgba(255, 255, 255, .85) 0%, rgba(255, 255, 255, 0) 60%);
      filter: blur(2px);
      opacity: .65;
      animation: floaty 6s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes floaty {

      0%,
      100% {
        transform: translate(-10px, 0px) rotate(0deg)
      }

      50% {
        transform: translate(10px, 12px) rotate(10deg)
      }
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 999px;
      background: rgba(225, 29, 72, .10);
      width: fit-content;
      font-weight: 800;
      letter-spacing: .01em;
    }

    .badge .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 4px rgba(225, 29, 72, .18);
      animation: pulse 1.6s ease-in-out infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        transform: scale(1)
      }

      50% {
        transform: scale(1.18)
      }
    }

    h1 {
      margin: 10px 0 2px;
      font-size: clamp(28px, 4vw, 42px);
      line-height: 1.06;
    }

    .sub {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 16px;
    }

    .msg {
      margin-top: 10px;
      padding: 14px 14px;
      background: rgba(255, 255, 255, .72);
      border: 1px solid var(--stroke);
      border-radius: 16px;
      font-size: 17px;
      line-height: 1.48;
      white-space: pre-wrap;
      position: relative;

      /* MÁS ESPACIO: casi toda la altura disponible */
      max-height: 360px;
      overflow: auto;
      padding-right: 10px;
      scrollbar-gutter: stable;
    }

    .msg::-webkit-scrollbar {
      width: 10px;
    }

    .msg::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, .15);
      border-radius: 999px;
      border: 3px solid transparent;
      background-clip: content-box;
    }

    .msg::-webkit-scrollbar {
      width: 10px;
    }

    .msg::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, .15);
      border-radius: 999px;
      border: 3px solid transparent;
      background-clip: content-box;
    }

    .cursor {
      display: inline-block;
      width: 10px;
      height: 1.1em;
      transform: translateY(2px);
      background: rgba(225, 29, 72, .55);
      margin-left: 2px;
      border-radius: 3px;
      animation: blink 1s steps(1) infinite;
      vertical-align: bottom;
    }

    @keyframes blink {

      0%,
      49% {
        opacity: 1
      }

      50%,
      100% {
        opacity: 0
      }
    }

    .counter {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 12px;
    }

    .tile {
      background: rgba(255, 255, 255, .72);
      border: 1px solid var(--stroke);
      border-radius: 16px;
      padding: 10px 10px;
      text-align: center;
    }

    .tile b {
      display: block;
      font-size: 22px;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
    }

    .tile span {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .btnRow {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    button {
      border: none;
      border-radius: 16px;
      padding: 12px 14px;
      font-weight: 800;
      cursor: pointer;
      background: var(--accent);
      color: white;
      box-shadow: 0 12px 30px rgba(225, 29, 72, .22);
      transition: transform .08s ease, filter .2s ease;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
    }

    button:hover {
      filter: brightness(1.03)
    }

    button:active {
      transform: scale(.98)
    }

    button.secondary {
      background: rgba(0, 0, 0, .08);
      color: var(--ink);
      box-shadow: none;
      font-weight: 900;
    }

    .stage {
      flex: 1;
      width: 100%;
      border-radius: 16px;
      border: 1px solid var(--stroke);
      overflow: hidden;
      position: relative;
      background: rgba(255, 255, 255, .46);
      min-height: 320px;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block
    }

    .hint {
      color: var(--muted);
      font-size: 12px;
      margin: 0 2px;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      opacity: .9;
    }

    /* ===== OVERLAY CARTA (arreglado + animaciones) ===== */
    .overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 231, 240, .55);
      backdrop-filter: blur(10px);
      z-index: 9999;
      opacity: 0;
      animation: overlayIn .45s ease forwards;

      transition: opacity .35s ease;
    }

    @keyframes overlayIn {
      to {
        opacity: 1
      }
    }

    .envelopeWrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      transform: translateY(18px);
      animation: wrapIn .65s cubic-bezier(.2, 1.2, .2, 1) forwards;
    }

    @keyframes wrapIn {
      0% {
        transform: translateY(34px) scale(.92);
        opacity: 0
      }

      70% {
        transform: translateY(-6px) scale(1.02);
        opacity: 1
      }

      100% {
        transform: translateY(0) scale(1);
        opacity: 1
      }
    }

    .hint2 {
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      font-size: 13px;
      color: rgba(0, 0, 0, .55);
      text-align: center;
      max-width: 320px;
      opacity: .85;
    }

    .envelope {
      width: 340px;
      height: 240px;
      position: relative;
      cursor: pointer;
      transform-origin: 50% 70%;
      filter: drop-shadow(0 18px 35px rgba(0, 0, 0, .18));
      transform: translateZ(0);
    }

    .envBack {
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, .92);
      border: 1px solid rgba(0, 0, 0, .08);
      border-radius: 22px;
    }

    .envFront {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255, 255, 255, .78), rgba(255, 255, 255, .55));
      border: 1px solid rgba(0, 0, 0, .08);
      border-radius: 22px;
      clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 72%, 0 100%);
      z-index: 2;
    }

    .envFlap {
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, .96);
      border: 1px solid rgba(0, 0, 0, .08);
      border-radius: 22px;
      clip-path: polygon(0 0, 100% 0, 50% 58%);
      transform-origin: 50% 0%;
      transform: perspective(800px) rotateX(0deg);
      transition: transform .60s cubic-bezier(.2, 1.2, .2, 1);
      z-index: 4;
    }

    .letter {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 16px;
      height: 190px;
      background: rgba(255, 255, 255, .97);
      border: 1px solid rgba(0, 0, 0, .08);
      border-radius: 18px;
      transform: translateY(130px);
      transition: transform .70s cubic-bezier(.2, 1.2, .2, 1);
      z-index: 3;
      padding: 18px 16px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      text-align: center;
      box-shadow: 0 14px 30px rgba(0, 0, 0, .08);

      pointer-events: auto;
    }

    .letterTop .q {
      font-size: 26px;
      line-height: 1.05;
      font-weight: 900;
    }

    .intro {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding-top: 6px;
    }

    .introTitle {
      font-size: 28px;
      line-height: 1.05;
      font-weight: 800;
      letter-spacing: -0.6px;
      color: rgba(0, 0, 0, .86);
      text-align: center;
      text-transform: uppercase;

      max-width: 92%;
      word-break: keep-all;
    }

    .vbtn.open {
      background: linear-gradient(180deg, #ff6b97, var(--accent));
      color: #fff;
      box-shadow: 0 12px 28px rgba(225, 29, 72, .25);
      border: 0;

      margin-top: 10px;

      position: static;
      top: auto;
      left: auto;
      transform: none;
      margin-top: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* Estados: antes de abrir solo se ve "TIENES UNA CARTA" + ABRIR */
    .overlay:not(.open) .q,
    .overlay:not(.open) #btnField,
    .overlay:not(.open) #noMsg {
      display: none;
    }

    .overlay.open .intro {
      display: none;
    }

    .letterBtns {
      position: relative;
      height: 62px;
      width: 100%;
      margin: 0 auto;
    }

    .vbtn {
      border: none;
      border-radius: 16px;
      padding: 12px 16px;
      font-weight: 900;
      cursor: pointer;
      transition: transform .08s ease, filter .2s ease, left .12s ease, top .12s ease;
      position: absolute;
      top: 10px;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      user-select: none;
      -webkit-user-select: none;
    }

    .vbtn:active {
      transform: scale(.98);
    }

    .vbtn.yes {
      left: 70px;
      background: #e11d48;
      color: #fff;
      box-shadow: 0 12px 30px rgba(225, 29, 72, .22);
    }

    .vbtn.no {
      left: 190px;
      background: rgba(0, 0, 0, .08);
      color: rgba(0, 0, 0, .8);
    }

    .noMsg {
      font-size: 13px;
      color: rgba(0, 0, 0, .60);
      font-weight: 900;
      min-height: 18px;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
    }

    .overlay.open .envFlap {
      transform: perspective(800px) rotateX(170deg);

      pointer-events: none;
    }

    .overlay.open .letter {
      transform: translateY(-58px);

      pointer-events: auto;
    }

    .overlay.hide {
      backdrop-filter: none;

      opacity: 0 !important;
      pointer-events: none;
      transition: opacity .35s ease;
      animation: none !important;
    }

    @keyframes overlayOut {
      to {
        opacity: 0;
        visibility: hidden;
      }
    }

    .shake {
      animation: shake .28s ease-in-out;
    }

    @keyframes shake {

      0%,
      100% {
        transform: translateX(0)
      }

      25% {
        transform: translateX(-6px)
      }

      50% {
        transform: translateX(6px)
      }

      75% {
        transform: translateX(-4px)
      }
    }



    .videoWrap {
      display: none;
      /* se muestra al tocar "Ver video" */
      margin-top: 12px;
    }

    .videoBox {
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(0, 0, 0, .08);
      box-shadow: 0 10px 28px rgba(0, 0, 0, .10);
      background: #000;
    }

    .videoBox iframe {
      width: 100%;
      aspect-ratio: 9/16;
      /* shorts vertical */
      display: block;
      background: #000;
    }

    @media (min-width: 901px) {

      /* en desktop no tan alto: centrado y con ancho razonable */
      .videoBox {
        max-width: 360px;
      }
    }

    .miniLink {
      align-self: center;
      font-size: 13px;
      color: rgba(0, 0, 0, .65);
      text-decoration: none;
      padding: 10px 12px;
      border-radius: 999px;
      border: 1px solid rgba(0, 0, 0, .10);
      background: rgba(255, 255, 255, .65);
      transition: transform .15s ease, background .15s ease;
      white-space: nowrap;
    }

    .miniLink:hover {
      transform: translateY(-1px);
      background: rgba(255, 255, 255, .85);
    }
  </style>
</head>

<body>

  <!-- OVERLAY CARTA -->
  <div id="valentineOverlay" class="overlay">
    <div class="envelopeWrap">
      <div class="envelope" id="envelope">
        <div class="envBack"></div>
        <div class="envFront"></div>
        <div class="envFlap"></div>

        <div class="letter" id="letter">
          <div class="letterTop">
            <div class="intro">
              <div class="introTitle">TIENES UNA CARTA 💌</div>
              <button id="btnOpen" class="vbtn open">ABRIR</button>
            </div>
            <div class="q">¿Querés ser mi San Valentín?</div>
          </div>

          <div class="letterBtns" id="btnField">
            <button id="btnYes" class="vbtn yes">Sí</button>
            <button id="btnNo" class="vbtn no">No</button>
          </div>

          <div id="noMsg" class="noMsg"></div>
          <div style="margin-top:10px; font-size:14px; opacity:.75;"></div>
        </div>
      </div>

      <div class="hint2">Tocá "ABRIR" o el sobre 💌</div>
    </div>
  </div>

  <div class="wrap">
    <div class="card">
      <div class="left">
        <div class="sparkle"></div>
        <div class="stage">
          <canvas id="cv"></canvas>
        </div>
        <div class="hint">Te amo ❤️ espero q te guste</div>
      </div>

      <div class="right">
        <div class="badge"><span class="dot"></span> <span id="toLine"></span></div>
        <h1 id="titleLine"></h1>
        <p class="sub" id="subLine"></p>

        <div class="msg">
          <span id="typed"></span><span class="cursor" id="cursor"></span>
        </div>

        <div class="counter" aria-label="contador">
          <div class="tile"><b id="dd">0</b><span>días</span></div>
          <div class="tile"><b id="hh">00</b><span>horas</span></div>
          <div class="tile"><b id="mm">00</b><span>min</span></div>
          <div class="tile"><b id="ss">00</b><span>seg</span></div>
        </div>

        <div class="btnRow">
          <button id="more">Más corazones</button>
          <a class="miniLink" id="ytOpen" href="https://youtube.com/shorts/3qfaNswwSxQ" target="_blank"
            rel="noopener">Abrir en YouTube ↗</a>
          <button class="secondary" id="copy">Copiar mensaje</button>
        </div>
      </div>
    </div>
  </div>
  </div>

  <script>
    (() => {
      "use strict";

      const NOMBRE = "Luci";
      const FECHA_INICIO = "2025-01-04T00:00:00";

      const TITULO = `Te amo, ${NOMBRE} ❤️`;
      const SUB = `Desde el 4 de enero de 2025, hasta el dia de hoy te amo.`;

      const MENSAJE =
        `Luci, mi amor:

Desde que empezamos a salir me enseñaste muchas cosas y sobre la relacion

cada dia con vos son hermosos porque vos los haces hermosos, se que no soy
el mejor hombre y que me mando muchas cagandas pero espero ser el hombre q te haga feliz

Sos la mujer mas hermosa y linda que existe en el planeta y me siento muy afortunado de tenerte a mi lado, gracias por elegirme y por ser tan buena mujer.
Le agradezco a dios de haberte conocido, gracias por haber estado para mi en mis peores momentos

apesar de no poder pasar este 14 de febrero juntos, pero espero que cuando vuelvas lo podamos festejar ❤️

Te amo. ❤️`;

      const $ = (id) => document.getElementById(id);

      // estado global
      let started = false;

      $("toLine").textContent = `Para: ${NOMBRE} ❤️`;
      $("titleLine").textContent = TITULO;
      $("subLine").textContent = SUB;

      // typewriter (ARRANCA CUANDO TOCÁS "SÍ")
      const typedEl = $("typed");
      const cursorEl = $("cursor");
      let ti = 0;
      let typeTimer = null;

      function startTypewriter() {
        ti = 0;
        typedEl.textContent = "";
        cursorEl.style.opacity = "1";
        const isMobile = window.matchMedia("(max-width: 900px)").matches;
        const speed = isMobile ? 18 : 16; // ms por char
        const step = () => {
          typedEl.textContent = MENSAJE.slice(0, ti++);
          // mantener scroll abajo mientras escribe
          const box = typedEl.parentElement;
          box.scrollTop = box.scrollHeight;

          if (ti <= MENSAJE.length) {
            typeTimer = setTimeout(step, speed);
          } else {
            cursorEl.style.opacity = "0.55";
            typeTimer = null;
          }
        };
        step();
      }

      // contador (ARRANCA CUANDO TOCÁS "SÍ")
      const dd = $("dd"), hh = $("hh"), mm = $("mm"), ss = $("ss");
      const start = new Date(FECHA_INICIO).getTime();
      const pad = (n) => String(n).padStart(2, "0");
      let counterTimer = null;

      function tickCounter() {
        let s = Math.floor((Date.now() - start) / 1000);
        if (s < 0) s = 0;
        const days = Math.floor(s / 86400); s %= 86400;
        const hrs = Math.floor(s / 3600); s %= 3600;
        const mins = Math.floor(s / 60);
        const secs = s % 60;
        dd.textContent = String(days);
        hh.textContent = pad(hrs);
        mm.textContent = pad(mins);
        ss.textContent = pad(secs);
      }

      function startCounter() {
        tickCounter();
        counterTimer = setInterval(tickCounter, 250);
      }

      // canvas
      const cv = $("cv");
      const ctx = cv.getContext("2d", { alpha: true });

      let W = 900, H = 720, dpr = 1;

      function fitCanvas() {
        const rect = cv.getBoundingClientRect();
        dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
        cv.width = Math.max(1, Math.floor(rect.width * dpr));
        cv.height = Math.max(1, Math.floor(rect.height * dpr));
        W = cv.width; H = cv.height;
      }

      const MAX_CANVAS_HEARTS = 560;
      const MAX_SPARKS = 520;
      const MAX_RAIN = 220;

      function heartPoint(t) {
        const x = 16 * Math.pow(Math.sin(t), 3);
        const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
        return { x, y };
      }

      function makeHeartSprite(size) {
        const c = document.createElement("canvas");
        c.width = c.height = size;
        const g = c.getContext("2d");
        g.translate(size / 2, size / 2);
        g.scale(size / 38, size / 38);
        g.beginPath();
        for (let i = 0; i <= 140; i++) {
          const tt = i / 140 * Math.PI * 2;
          const p = heartPoint(tt);
          const X = p.x, Y = -p.y;
          if (i === 0) g.moveTo(X, Y); else g.lineTo(X, Y);
        }
        g.closePath();
        const grd = g.createLinearGradient(-20, -20, 20, 20);
        grd.addColorStop(0, "#ff4b7a");
        grd.addColorStop(1, "#b8002b");
        g.fillStyle = grd;
        g.fill();
        return c;

ECBAgACBkIABIPQsqQQIECCwJaCGAAECBAgQIFASMACUvqWVAAECBJYEtBAgQIAAAQIEUgIGgNS7xBIgQIDAjoASAgQIECBAgEBLwADQ+pdaAgQIEFgR0EGAAAECBAgQiAkYAGIPk0uAAAECGwIqCBAgQIAAAQI1AQNA7WN6CRAgQGBBQAMBAgQIECBAICdgAMi9TDABAgQI/AsoIECAAAECBAj0BAwAvZ8pJkCAAIFvAfcJECBAgAABAkGBAwAA//843y5gAAAABklEQVQDAG+JeimsoaUkAAAAAElFTkSuQmCC";
      let heartPicReady = false;
      heartPic.onload = () => heartPicReady = true;

      function drawHeartPhoto() {
        // mismo tamaño/posición que el contorno
        const baseX = TREE_BASE_X || (W * 0.56);
        const trunkTopNow = TREE_TRUNK_TOP_Y || (H * 0.80 - H * 0.28);

        const cx = baseX;
        const cy = trunkTopNow - (H * 0.18);
        const scale = Math.min(W, H) * 0.012 * 1.15;

        // path de corazón
        ctx.save();
        ctx.beginPath();
        for (let i = 0; i <= 220; i++) {
          const t = (i / 220) * Math.PI * 2;
          const p = heartPoint(t);
          const x = cx + p.x * scale;
          const y = cy - p.y * scale;
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.clip();

        // "cover" dentro de un bbox aprox del corazón
        const boxW = 34 * scale;
        const boxH = 30 * scale;

        const iw = heartPic.naturalWidth || 1;
        const ih = heartPic.naturalHeight || 1;
        const r = Math.max(boxW / iw, boxH / ih);
        const dw = iw * r;
        const dh = ih * r;

        ctx.globalAlpha = 0.98;
        ctx.drawImage(heartPic, cx - dw / 2, cy - dh / 2, dw, dh);

        // leve velo para que combine con el estilo
        ctx.globalAlpha = 0.10;
        ctx.fillStyle = "rgba(255,255,255,1)";
        ctx.fillRect(cx - boxW / 2, cy - boxH / 2, boxW, boxH);

        ctx.restore();
      }


      // árbol
      let grow = 0;
      let TREE_BASE_X = 0;
      let TREE_TRUNK_TOP_Y = 0;

      function drawTree() {
        const baseX = W * 0.56, baseY = H * 0.95;
        TREE_BASE_X = baseX;

        const trunkH = H * 0.28 * grow;
        const trunkW = W * 0.038 * (0.75 + 0.25 * grow);
        TREE_TRUNK_TOP_Y = baseY - trunkH;

        ctx.save();
        ctx.fillStyle = "rgba(120,72,38,.95)";
        ctx.fillRect(baseX - trunkW / 2, baseY - trunkH, trunkW, trunkH);

        const bx = baseX;
        const by = baseY - trunkH * 0.78;

        ctx.strokeStyle = "rgba(120,72,38,.95)";
        ctx.lineWidth = Math.max(2 * dpr, 7 * dpr * grow);
        ctx.lineCap = "round";

        const arm = W * 0.15 * grow;
        ctx.beginPath();
        ctx.moveTo(bx, by);
        ctx.quadraticCurveTo(bx - arm * 0.55, by - H * 0.06 * grow, bx - arm, by - H * 0.08 * grow);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(bx, by);
        ctx.quadraticCurveTo(bx + arm * 0.55, by - H * 0.06 * grow, bx + arm, by - H * 0.08 * grow);
        ctx.stroke();

        ctx.restore();
      }

      function drawCanvasTitle() {
        ctx.save();
        ctx.textAlign = "center";
        ctx.fillStyle = "rgba(225,29,72,.88)";
        ctx.font = `${Math.floor(Math.min(W, H) * 0.040)}px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial`;
        ctx.fillText("San Valentín", W * 0.52, H * 0.08);

        ctx.fillStyle = "rgba(31,31,31,.55)";
        ctx.font = `${Math.floor(Math.min(W, H) * 0.028)}px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial`;
        ctx.fillText(`Luci & Seba`, W * 0.52, H * 0.13);
        ctx.restore();
      }

      function drawGround() {
        ctx.save();
        ctx.strokeStyle = "rgba(0,0,0,.15)";
        ctx.lineWidth = Math.max(1 * dpr, Math.floor(Math.min(W, H) * 0.004));
        ctx.beginPath();
        ctx.moveTo(W * 0.08, H * 0.95);
        ctx.lineTo(W * 0.92, H * 0.95);
        ctx.stroke();
        ctx.restore();
      }

      // corazón: targets SOLO CONTORNO
      let HEART_TARGETS = [];
      let HEART_CENTER = { x: 0, y: 0 };

      function rotateArray(arr, k) {
        if (!arr.length) return arr;
        const n = arr.length;
        const i = ((k % n) + n) % n;
        return arr.slice(i).concat(arr.slice(0, i));
      }

      function buildHeartTargets() {
        const baseX = TREE_BASE_X || (W * 0.56);
        const trunkTopNow = TREE_TRUNK_TOP_Y || (H * 0.95 - H * 0.28);

        const cx = baseX;
        const cy = trunkTopNow - (H * 0.18); // subir/bajar corazón

        const scale = Math.min(W, H) * 0.014; // tamaño del corazón

        HEART_CENTER = { x: cx, y: cy };

        const originX = baseX;
        const originY = trunkTopNow + (H * 0.03);

        const outline = [];
        const N = 360;
        for (let i = 0; i < N; i++) {
          const t = (i / N) * Math.PI * 2;
          const p = heartPoint(t);
          outline.push({
            x: cx + p.x * scale * 1.15,
            y: cy - p.y * scale * 1.15
          });
        }

        // arrancar desde el punto más cercano al tronco
        let best = 0, bestD = Infinity;
        for (let i = 0; i < outline.length; i++) {
          const d = Math.hypot(outline[i].x - originX, outline[i].y - originY);
          if (d < bestD) { bestD = d; best = i; }
        }
        const outlineRot = rotateArray(outline, best);

        HEART_TARGETS = outlineRot.slice(0, MAX_CANVAS_HEARTS);
      }

      // partículas
      const spark = [];
      function sparkBurst(x, y, n = 10) {
        const room = MAX_SPARKS - spark.length;
        if (room <= 0) return;
        const add = Math.min(n, room);
        for (let i = 0; i < add; i++) {
          spark.push({
            x, y,
            vx: (-1 + Math.random() * 2) * 1.2 * dpr,
            vy: (-1 + Math.random() * 2) * 1.2 * dpr,
            life: 18 + Math.random() * 14,
            r: (1.0 + Math.random() * 1.8) * dpr,
            a: 0.55 + Math.random() * 0.35
          });
        }
      }

      // corazones del contorno
      const hearts = [];
      let targetIndex = 0;

      function spawnHearts(n = 18) {
        if (!HEART_TARGETS.length) return;
        const add = Math.min(n, MAX_CANVAS_HEARTS - hearts.length);
        if (add <= 0) return;

        const originX = TREE_BASE_X || (W * 0.56);
        const originY = (TREE_TRUNK_TOP_Y || (H * 0.80 - H * 0.28)) + (H * 0.03);

        for (let i = 0; i < add; i++) {
          const size = (16 + Math.random() * 14) * dpr;
          const t = HEART_TARGETS[targetIndex % HEART_TARGETS.length];
          targetIndex++;

          const x = originX + (-5 + Math.random() * 10) * dpr;
          const y = originY + (-5 + Math.random() * 10) * dpr;

          hearts.push({
            x, y,
            vx: (-0.5 + Math.random()) * 0.12 * dpr,
            vy: (-0.5 + Math.random()) * 0.12 * dpr,
            size,
            rot: Math.random() * Math.PI * 2,
            vr: (-0.5 + Math.random()) * 0.02,
            tx: t.x,
            ty: t.y,
            settled: false
          });
        }
      }

      // lluvia extra (botón)
      const rain = [];
      function spawnRain(n = 42) {
        const add = Math.min(n, MAX_RAIN - rain.length);
        for (let i = 0; i < add; i++) {
          rain.push({
            x: (Math.random() * W),
            y: -20 * dpr - Math.random() * 60 * dpr,
            vy: (1.1 + Math.random() * 2.0) * dpr,
            vx: (-0.5 + Math.random() * 1.0) * dpr,
            rot: Math.random() * Math.PI * 2,
            vr: (-0.5 + Math.random()) * 0.03,
            size: (14 + Math.random() * 18) * dpr,
            life: 220 + Math.random() * 160
          });
        }
      }

      // loop
      let t0 = performance.now();
      let lowFx = false;
      let heartStarted = false;

      function loop(now) {
        const dt = Math.min(33, now - t0);
        t0 = now;

        lowFx = hearts.length > 420;

        ctx.clearRect(0, 0, W, H);

        // fondo suave
        ctx.save();
        const grd = ctx.createRadialGradient(W * 0.20, H * 0.10, 10, W * 0.50, H * 0.50, Math.max(W, H) * 0.75);
        grd.addColorStop(0, "rgba(255,227,238,.55)");
        grd.addColorStop(1, "rgba(255,255,255,.15)");
        ctx.fillStyle = grd;
        ctx.fillRect(0, 0, W, H);
        ctx.restore();

        // árbol
        grow = Math.min(1, grow + dt / 1800);
        drawTree();
        drawCanvasTitle();

        // arrancar corazón una vez
        if (!heartStarted && grow > 0.96) {
          heartStarted = true;
          buildHeartTargets();
          spawnHearts(80);
          sparkBurst(HEART_CENTER.x, HEART_CENTER.y, 18);
        }

        // completar contorno
        if (HEART_TARGETS.length && hearts.length < MAX_CANVAS_HEARTS) {
          spawnHearts(14);
        }

        // cuando termina el corazón, mostrar la foto adentro
        if (heartPicReady && heartStarted) {
          let settledCount = 0;
          for (const h of hearts) { if (h.settled) settledCount++; }
          if (HEART_TARGETS.length && settledCount >= Math.floor(HEART_TARGETS.length * 0.92)) {
            drawHeartPhoto();
          }
        }

        // dibujar contorno
        for (const h of hearts) {
          if (!h.settled) {
            h.x += h.vx;
            h.y += h.vy;
            h.rot += h.vr;

            const dx = h.tx - h.x;
            const dy = h.ty - h.y;

            h.x += dx * 0.052;
            h.y += dy * 0.052;

            if (Math.hypot(dx, dy) < 2.2 * dpr) {
              h.settled = true;
              sparkBurst(h.x, h.y, lowFx ? 2 : 6);
            }
          }

          ctx.save();
          ctx.translate(h.x, h.y);
          ctx.rotate(h.rot);
          ctx.globalAlpha = h.settled ? 0.98 : 0.90;

          if (!lowFx) {
            ctx.shadowColor = "rgba(225,29,72,.14)";
            ctx.shadowBlur = 5 * dpr;
          } else {
            ctx.shadowBlur = 0;
          }

          const s = h.size;
          ctx.drawImage(spr, -s / 2, -s / 2, s, s);
          ctx.restore();
        }

        // lluvia extra
        for (let i = rain.length - 1; i >= 0; i--) {
          const r = rain[i];
          r.x += r.vx;
          r.y += r.vy;
          r.rot += r.vr;
          r.life -= 1;

          ctx.save();
          ctx.translate(r.x, r.y);
          ctx.rotate(r.rot);
          ctx.globalAlpha = Math.min(0.9, r.life / 220);
          const s = r.size;
          ctx.drawImage(spr, -s / 2, -s / 2, s, s);
          ctx.restore();

          if (r.y > H + 80 * dpr || r.life <= 0) rain.splice(i, 1);
        }

        // partículas
        for (let i = spark.length - 1; i >= 0; i--) {
          const p = spark[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vx *= 0.90;
          p.vy *= 0.90;
          p.life -= 1;

          ctx.save();
          ctx.globalAlpha = Math.max(0, (p.life / 35) * p.a);
          ctx.fillStyle = "rgba(225,29,72,.90)";
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();

          if (p.life <= 0) spark.splice(i, 1);
        }

        drawGround();
        requestAnimationFrame(loop);
      }

      // botón (más corazones)
      let lastBurst = 0;
      function burst() {
        const now = Date.now();
        if (now - lastBurst < 320) return;
        lastBurst = now;
        spawnRain(70);
        sparkBurst(HEART_CENTER.x || (W * 0.56), HEART_CENTER.y || (H * 0.30), 12);
      }
      $("more").addEventListener("click", burst);
      cv.addEventListener("click", burst);

      $("copy").addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(MENSAJE);
          alert("Mensaje copiado ❤️");
        } catch (e) {
          alert("No pude copiar automáticamente. Seleccioná el texto y copiá manual.");
        }
      });

      // start (NO ARRANCA HASTA APRETAR "SÍ")
      function startCanvas() {
        // reset estado por si alguna vez lo reusás
        grow = 0;
        HEART_TARGETS = [];
        hearts.length = 0;
        rain.length = 0;
        spark.length = 0;
        targetIndex = 0;
        heartStarted = false;

        fitCanvas();
        requestAnimationFrame(loop);
        setTimeout(() => { spawnRain(24); }, 700);
      }

      window.addEventListener("resize", () => {
        if (!started) return;
        fitCanvas();
        HEART_TARGETS = [];
        hearts.length = 0;
        rain.length = 0;
        targetIndex = 0;
        heartStarted = false;
      });

      /* ===== CARTA SAN VALENTÍN (overlay) ===== */
      const overlay = document.getElementById("valentineOverlay");
      const envelope = document.getElementById("envelope");
      const btnYes = document.getElementById("btnYes");
      const btnNo = document.getElementById("btnNo");
      const btnOpen = document.getElementById("btnOpen");
      const noMsg = document.getElementById("noMsg");
      const btnField = document.getElementById("btnField");

      let opened = false;

      function openEnvelope() {
        if (opened) return;
        opened = true;
        overlay.classList.add("open");
      }

      // abrir sobre (o botón ABRIR)
      envelope.addEventListener("click", (e) => {
        e.stopPropagation();
        openEnvelope();
      });
      btnOpen.addEventListener("click", (e) => {
        e.stopPropagation();
        openEnvelope();
      });

      // SI: cerrar overlay y ARRANCAR TODO
      function startExperience() {
        if (started) return;
        started = true;

        // arrancar animaciones
        startCanvas();
        startTypewriter();
        startCounter();

        // asegurar scroll al final durante escritura
        const msgBox = document.querySelector(".msg");
        msgBox.scrollTop = msgBox.scrollHeight;
      }

      btnYes.addEventListener("click", (e) => {
        e.stopPropagation();
        startExperience();
        overlay.classList.add("hide");
        setTimeout(() => { overlay.style.display = "none"; overlay.remove(); }, 420);
        spawnRain(90);
      });

      // ===== MODO TROLL MAX (SIN CAMBIAR TAMAÑO) =====
      let trollLock = false;

      function escapeNo() {
        if (!opened) return;
        if (trollLock) return;
        trollLock = true;

        noMsg.textContent = "¿Qué carajos me importa? :D";
        noMsg.classList.remove("shake");
        void noMsg.offsetWidth;
        noMsg.classList.add("shake");

        const fieldRect = btnField.getBoundingClientRect();
        const bw = btnNo.offsetWidth;
        const bh = btnNo.offsetHeight;

        const padding = 8;
        const maxX = Math.max(padding, fieldRect.width - bw - padding);
        const maxY = Math.max(padding, fieldRect.height - bh - padding);

        const x = padding + Math.random() * (maxX - padding);
        const y = padding + Math.random() * (maxY - padding);

        btnNo.style.left = `${x}px`;
        btnNo.style.top = `${y}px`;

        const doDouble = Math.random() < 0.35;

        setTimeout(() => {
          trollLock = false;
          if (doDouble && opened) {
            setTimeout(() => escapeNo(), 70);
          }
        }, 90);
      }

      // PC: apenas te acercás
      btnNo.addEventListener("mouseenter", (e) => { e.stopPropagation(); escapeNo(); });
      btnNo.addEventListener("mousemove", (e) => { e.stopPropagation(); escapeNo(); });

      // PC + CELU: intentás tocar/clickeas
      btnNo.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        e.stopPropagation();
        escapeNo();
      });

      // CELU: primer toque
      btnNo.addEventListener("touchstart", (e) => {
        e.preventDefault();
        e.stopPropagation();
        escapeNo();
      }, { passive: false });

      // CELU: si el dedo se acerca al NO dentro del campo, huye
      btnField.addEventListener("touchmove", (e) => {
        if (!opened) return;
        const t = e.touches && e.touches[0];
        if (!t) return;

        const r = btnNo.getBoundingClientRect();
        const dx = Math.max(r.left - t.clientX, 0, t.clientX - r.right);
        const dy = Math.max(r.top - t.clientY, 0, t.clientY - r.bottom);
        const dist = Math.hypot(dx, dy);

        if (dist < 55) escapeNo();
      }, { passive: false });

      // EXTRA troll: si tocás cerca del NO, también huye
      btnField.addEventListener("pointerdown", (e) => {
        if (!opened) return;

        const r = btnNo.getBoundingClientRect();
        const x = e.clientX, y = e.clientY;

        const dx = Math.max(r.left - x, 0, x - r.right);
        const dy = Math.max(r.top - y, 0, y - r.bottom);
        const dist = Math.hypot(dx, dy);

        if (dist < 70) {
          e.preventDefault();
          escapeNo();
        }
      });


    })();
  </script>
</body>
